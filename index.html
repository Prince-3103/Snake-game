<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="infos">
                <div class="score-info">
                    <div class="info">
                        <h3>High Score:
                            <span class="high-score">0</span>
                        </h3>
                    </div>
                    <div class="info">
                        <h3>Score:
                            <span class="your-score">0</span>
                        </h3>
                    </div>
                    <div class="info">
                        <h3>Time:
                            <span class="timer">00:00</span>
                        </h3>
                    </div>
                </div>
                <button id="start-btn">Start Game</button>
            </div>
            <div class="board"></div>
        </section>
        <div class="game-over">
            <div class="game-over-card">
                <h1>Game Over!</h1>

                <div class="score-container">
                    <div class="score">
                        <p>High Score</p>
                        <span class="high-score">0</span>
                    </div>

                    <div class="score">
                        <p>Your Score</p>
                        <span class="your-score">0</span>
                    </div>

                    <div class="score">
                        <p>Time</p>
                        <span class="timer">00:00</span>
                    </div>
                </div>

                <button id="restart-btn">Play Again</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
